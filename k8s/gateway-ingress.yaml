apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iiisconnect-gateway
  namespace: weixu
  annotations:
    cert-manager.io/issuer: letsencrypt-iiis-co
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - iiisconnect.iiis.co
    secretName: iiisconnect-tls
  rules:
  - host: iiisconnect.iiis.co
    http:
      paths:
      # Only expose WebSocket paths for cross-cluster agent connection
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: iiisconnect-gateway
            port:
              number: 80
      # Health check for Ingress/cert-manager probes
      - path: /health
        pathType: Exact
        backend:
          service:
            name: iiisconnect-gateway
            port:
              number: 80
