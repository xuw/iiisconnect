apiVersion: apps/v1
kind: Deployment
metadata:
  name: iiisconnect-gateway
  namespace: weixu
  labels:
    app: iiisconnect-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iiisconnect-gateway
  template:
    metadata:
      labels:
        app: iiisconnect-gateway
    spec:
      containers:
      - name: gateway
        image: harbor.xa.xshixun.com:7443/weixu/lab-cpu:latest
        command:
        - bash
        - -c
        - |
          set -e
          export http_proxy=http://192.168.3.226:7890
          export https_proxy=http://192.168.3.226:7890
          pip install fastapi uvicorn[standard] websockets httpx aiofiles --break-system-packages -q 2>/dev/null || \
          pip install fastapi uvicorn[standard] websockets httpx aiofiles -q
          unset http_proxy https_proxy
          cd /data/repos/iiisconnect
          # Start HTTP proxy (port 3128) in background
          python3 -m gateway.proxy &
          PROXY_PID=$!
          # Start main gateway (port 8000)
          exec python3 -m uvicorn gateway.server:app \
            --host 0.0.0.0 --port 8000 \
            --ws-max-size 20971520 --log-level info
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 3128
          name: proxy
        env:
        - name: IIISCONNECT_CACHE_DIR
          value: "/data/iiisconnect-cache"
        - name: IIISCONNECT_PORT
          value: "8000"
        - name: UPSTREAM_PROXY
          value: "http://192.168.3.226:7890"
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: gpfshome
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: gpfshome
        persistentVolumeClaim:
          claimName: pvc-gpfshome-weixu
      imagePullSecrets:
      - name: harbor-xa-registry
